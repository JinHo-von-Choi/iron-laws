name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Check support matrix manifest is up to date
        run: uv run python benchmarks/build_support_manifest.py --check

      - name: Run Tests with Coverage
        run: uv run pytest --cov=iron_laws --cov-report=xml -v

      - name: Run Self-Audit (Iron Laws Check)
        run: uv run iron-laws check . --fail-on HIGH

      - name: Record self-audit trust metrics (report mode)
        run: |
          mkdir -p "$RUNNER_TEMP/iron-laws-trust"
          uv run iron-laws audit . --format json -o "$RUNNER_TEMP/iron-laws-trust/audit.json"
          uv run python .github/scripts/trust_report.py "$RUNNER_TEMP/iron-laws-trust/audit.json" "$RUNNER_TEMP/iron-laws-trust/metrics.json"

      - name: Enforce verified fixed scope
        run: |
          uv run iron-laws audit tests/fixtures/trust_scope --contract tests/fixtures/trust_scope/contract.yml --max-analysis-unknown-rate 0 --max-unverified-rule-language-rate 0 --format json -o "$RUNNER_TEMP/iron-laws-trust/fixed-scope.json"
          uv run iron-laws evidence verify "$RUNNER_TEMP/iron-laws-trust/fixed-scope.json"

      - name: Upload trust reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/iron-laws-trust/
          if-no-files-found: ignore

  smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel into a clean environment
        shell: bash
        run: |
          python -m venv .smoke-env
          if [ -f .smoke-env/Scripts/python.exe ]; then PY=.smoke-env/Scripts/python.exe; else PY=.smoke-env/bin/python; fi
          "$PY" -m pip install --quiet dist/*.whl
          echo "SMOKE_PY=$PY" >> "$GITHUB_ENV"

      - name: Run smoke test against the installed package
        shell: bash
        run: '"$SMOKE_PY" .github/scripts/smoke.py'
