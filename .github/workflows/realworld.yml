name: realworld-loop
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - id: loop
        run: uv run python benchmarks/realworld_loop.py work --fetch
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: realworld-triage
          path: work/triage.md
      - if: steps.loop.outcome == 'failure'
        run: echo "고정 커밋 실제 프로젝트의 보안 지적이 달라졌습니다(종료코드 3이면 판 번호를 올리지 않은 판정 변경 포함). triage.md를 확인하십시오." && exit 1
