repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: iron-laws
        name: iron-laws check
        entry: uv run iron-laws check
        args: ["."]
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
