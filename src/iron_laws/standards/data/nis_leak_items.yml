standard_name: 국가정보원 국가 사이버보안 기본지침 누출금지정보 목록
edition: '2026-05-01'
legal_basis: 국가 사이버보안 기본지침(국가정보원 지침, 2026.5.1. 개정) 제13조(제안요청서 기재사항) 제2항 각 호
source: 국가사이버안보센터(ncsc.go.kr) 게시 지침 원문 PDF 제13조제2항과 직접 대조
items:
- 'no': 1
  text: 해당 기관의 정보시스템 내·외부 IP주소 현황
- 'no': 2
  text: 정보시스템 구성 현황 및 정보통신망 구성도
- 'no': 3
  text: 관리자 및 개별사용자의 계정·비밀번호 등 정보시스템 접근권한 정보
- 'no': 4
  text: 정보통신망 또는 정보시스템 취약점 분석·평가 결과물
- 'no': 5
  text: 정보화사업 용역 결과물 및 관련 프로그램 소스코드(외부에 유출될 경우 국가안보 및 국익에 피해가 우려되는 중요 용역사업에 해당)
- 'no': 6
  text: 암호자재 및 정보보호시스템 도입·운용 현황
- 'no': 7
  text: 정보보호시스템 및 네트워크장비 설정 정보
- 'no': 8
  text: 「공공기관의 정보공개에 관한 법률」 제9조제1항에 따라 비공개 대상 정보로 분류된 해당 기관의 내부문서
- 'no': 9
  text: 「개인정보보호법」 제2조제1호에 따른 개인정보
- 'no': 10
  text: 「보안업무규정」 제4조에 따른 비밀 및 「보안업무규정 시행규칙」 제16조제3항에 따른 대외비
- 'no': 11
  text: 그 밖에 해당 기관의 장이 공개가 불가하다고 판단한 자료
