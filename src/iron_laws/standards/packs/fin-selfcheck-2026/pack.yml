items:
  - {id: "1", name: 공격자 IP 차단}
  - {id: "2", name: 공격자 IP에 따른 침해 시도·피해 점검}
  - {id: "3", name: 공격표면 최소화 및 입력값 검증}
  - {id: "4", name: 외부 노출 IT자산 및 서비스 식별 및 점검}
  - {id: "5", name: 인증·인가 검증 및 접근 제어}
  - {id: "6", name: 중요 서비스 강화된 인증(MFA)}
  - {id: "7", name: 세션 무결성 및 수평적 권한 상승 차단}
  - {id: "8", name: 요청 임계치 제한}
  - {id: "9", name: 실시간 보안관제 체계}
  - {id: "10", name: 패치 상태 점검 및 업데이트}
  - {id: "11", name: 의심 행위 식별·차단 탐지 모니터링}
  - {id: "12", name: 기술지원 종료 제품 식별 및 모니터링}
item_question:
  "1": 공유된 공격자 IP를 차단하였는가?
  "2": 공유된 공격자 IP에 따른 침해 시도 및 피해가 있었는지 점검하였는가?
  "3": 대외 게이트웨이 서버의 불필요한 서비스, 포트, API, 관리자페이지 등을 제거하여 공격표면을 최소화하고 외부 입력 파라미터에 대한 검증을 강화하고 있는가?
  "4": 침해경로로 악용될 수 있는 외부 노출 IT자산과 서비스를 면밀히 식별하여 취약점 및 접근통제 현황을 점검하고 신속히 조치하고 있는가?
  "5": 대외 시스템(웹페이지 등) 대상으로 인증·인가 검증 기능 누락 여부 및 접근 제어 취약점 등을 확인하여 검증하고 있는가?
  "6": 전자금융거래 등 중요 서비스 이용 시 강화된 인증 절차(MFA 등)를 적용하고 있는가?
  "7": 서비스(또는 API 등) 요청 시 세션 무결성을 검증하고, 수평적 권한 상승(타 고객 데이터 열람·수정) 차단 통제를 적용하고 있는가?
  "8": 비정상적인 대량 호출 및 자동화 봇 공격을 예방하기 위한 요청 임계치 제한(Rate Limiting) 등 통제 수단을 적용하고 있는가?
  "9": 사이버 위협 및 침해 시도에 대한 조기 탐지·대응을 위해 실시간 보안관제 체계를 운영하고 있는가?
  "10": 전체 전산시스템, 단말기, 네트워크 장비 등에 대한 보정(patch) 상태를 점검하여 최신 업데이트를 적용하고 있는가?
  "11": 비정상적인 URL 패턴이나 파라미터 요청 여부, 비인가된 IP나 야간·휴일 등에 관리자 계정 접근 시도 등 의심스러운 행위를 식별·차단하기 위한 탐지 모니터링 체계를 운영하고 있는가?
  "12": 제조사 기술지원 종료(EoS) 등 불가피한 보안패치 미적용 장비를 식별하고, 동 장비에 대한 미인가 접속 시도 여부 등 보안 모니터링을 강화하고 있는가?
